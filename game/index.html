<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunset Bay</title>
<link rel="icon" href="favicon.ico">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  #hud.on { display: block; }
  .panel { background: rgba(8, 12, 28, 0.62); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(2px); }
  #money { position: absolute; top: 12px; right: 12px; font-size: 26px; font-weight: 800;
    color: #7dff9a; text-shadow: 0 2px 6px rgba(0,0,0,0.7); letter-spacing: 0.5px; }
  #wanted { position: absolute; top: 52px; right: 12px; font-size: 22px; color: #ffd23f;
    letter-spacing: 3px; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
  #clock { position: absolute; top: 12px; left: 12px; font-size: 20px; font-weight: 700;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
  #district { position: absolute; top: 40px; left: 12px; font-size: 14px; color: #cfe3ff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
  #mission { position: absolute; top: 76px; left: 12px; max-width: 340px; font-size: 15px;
    line-height: 1.45; }
  #mission b { color: #ffd23f; }
  #speed { position: absolute; bottom: 16px; right: 12px; text-align: right; font-size: 15px;
    line-height: 1.5; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
  #speed .num { font-size: 30px; font-weight: 800; }
  #radio { position: absolute; bottom: 16px; left: 12px; font-size: 14px; color: #ffd9a0;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
  #message { position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
    font-size: 24px; font-weight: 700; text-align: center; color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9); display: none; white-space: nowrap; }
  #crosshair { position: absolute; top: 50%; left: 50%; width: 22px; height: 22px;
    margin: -11px 0 0 -11px; display: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff;
    box-shadow: 0 0 4px rgba(0,0,0,0.9); }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after { left: 0; top: 10px; width: 22px; height: 2px; }
  #minimap { position: absolute; bottom: 16px; left: 12px; width: 168px; height: 168px;
    border: 2px solid rgba(255,255,255,0.35); border-radius: 8px;
    background: rgba(8, 12, 28, 0.7); }
  #hud.with-radio #radio { bottom: 196px; }

  /* ---------- Title screen ---------- */
  #title { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(180deg, #1b2a52 0%, #7a4a8a 55%, #ff8c42 78%, #2a1a3a 100%); }
  #title.hidden { display: none; }
  #title h1 { font-size: 72px; font-weight: 900; letter-spacing: 4px;
    text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 10px 30px rgba(0,0,0,0.6); }
  #title h1 span { color: #ffd23f; }
  #title p.tagline { font-size: 18px; color: #ffe9c9; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
  #title .btns { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  #title button, .overlay button { pointer-events: auto; cursor: pointer; border: none;
    border-radius: 10px; padding: 14px 44px; font-size: 20px; font-weight: 700; color: #fff;
    background: linear-gradient(180deg, #ff9a3d, #e56b1f);
    box-shadow: 0 4px 0 #9c3f0e, 0 8px 18px rgba(0,0,0,0.45); }
  #title button:hover, .overlay button:hover { filter: brightness(1.1); }
  #title button.secondary { background: linear-gradient(180deg, #4a6fa5, #2f4a75);
    box-shadow: 0 4px 0 #1d2f4d, 0 8px 18px rgba(0,0,0,0.45); }
  #title button.hidden { display: none; }
  #title .hint { font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 8px; }

  /* ---------- Overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 8; display: none; align-items: center;
    justify-content: center; flex-direction: column; gap: 16px;
    background: rgba(5, 8, 20, 0.72); backdrop-filter: blur(3px); }
  .overlay.on { display: flex; }
  .overlay h2 { font-size: 44px; font-weight: 900; letter-spacing: 3px; }
  .overlay p { font-size: 16px; color: #d7e3ff; max-width: 560px; text-align: center;
    line-height: 1.6; }
  #mapOverlay .mapwrap { display: flex; gap: 20px; align-items: flex-start; }
  #mapCanvas { width: 560px; height: 560px; border: 2px solid rgba(255,255,255,0.4);
    border-radius: 10px; background: #101a33; }
  #mapInfo { width: 300px; font-size: 15px; line-height: 1.7; }
  #mapInfo h3 { color: #ffd23f; margin: 10px 0 4px; font-size: 17px; }
  #mapInfo ul { list-style: none; }
  #mapInfo li { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.12); }
  #mapInfo li.done { color: #7dff9a; text-decoration: line-through; }
  #mapInfo li.active { color: #ffd23f; font-weight: 700; }
  #mapInfo .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD, pause overlay, dan map overlay dibuat oleh hud.js (SB.HUD.ensure)
     saat runtime — markup statis di sini DIHAPUS karena menimbulkan ID
     ganda (#hud, #minimap, #crosshair, #pause-overlay, #map-overlay)
     dengan elemen yang dibuat HUD, dan tombolnya tak punya handler. -->

<div id="title">
  <h1>SUNSET <span>BAY</span></h1>
  <p class="tagline">An open-world sunset city. Take the wheel, run the jobs, own the night.</p>
  <div class="btns">
    <button id="btn-new">New Game</button>
    <button id="btn-continue" class="secondary hidden">Continue</button>
  </div>
  <p class="hint">WASD move &middot; E enter car / boat &middot; F attack &middot; M radio &middot; Tab map &middot; P pause</p>
</div>

<script src="src/math3.js"></script>
<script src="src/rng.js"></script>
<script src="src/gl.js"></script>
<script src="src/meshes.js"></script>
<script src="src/city.js"></script>
<script src="src/water.js"></script>
<script src="src/vehicles.js"></script>
<script src="src/player.js"></script>
<script src="src/jobs.js"></script>
<script src="src/game.js"></script>
<script src="src/hud.js"></script>
<script src="src/audio.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
